name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  model-free:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore ExcelTask.slnx -p:NuGetAudit=false
      - run: dotnet build ExcelTask.slnx -c Release --no-restore -p:NuGetAudit=false
      - run: dotnet test ExcelTask.slnx -c Release --no-build --no-restore --filter "RunType!=OnDemand" -p:NuGetAudit=false
